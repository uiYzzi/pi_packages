name: publish

on:
  push:
    tags: ["*-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: parse tag
        id: tag
        run: |
          TAG="${{ github.ref_name }}"
          PKG="${TAG%%-v*}"
          echo "package=$PKG" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: upgrade npm (trusted publishing requires >= 11.5.1)
        run: npm install -g npm@latest

      # npm workspace: install once at the root, then test/build/publish the package
      - run: npm ci

      # dependents compile against secret-kit's dist, which a fresh checkout lacks
      - run: npm run build -w packages/secret-kit

      - run: npm test -w packages/${{ steps.tag.outputs.package }}

      - run: npm run build -w packages/${{ steps.tag.outputs.package }}

      - run: npm publish --access public -w packages/${{ steps.tag.outputs.package }}
